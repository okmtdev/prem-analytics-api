name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # Renders both languages from the test fixture to make sure the CLI still runs end to end.
      - run: node --input-type=module -e "import('./test/fixtures/season-sample.json', { with: { type: 'json' } }).then(async (m) => { const { analyze } = await import('./src/analysis/index.js'); const { renderMarkdown } = await import('./src/render/markdown.js'); const i = analyze(m.default, { club: 'Arsenal' }); for (const lang of ['en', 'ja']) { const md = renderMarkdown(i, { lang }); if (!md.startsWith('# ')) throw new Error('render failed'); } console.log('render ok'); })"
